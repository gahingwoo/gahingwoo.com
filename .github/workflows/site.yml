name: Stamp assets and regenerate CV PDF

# Two things that must not lag the source, both derived from it:
#   - asset links carry a hash of the file's contents, so a changed stylesheet
#     is a changed URL and no visitor gets yesterday's CSS from cache;
#   - the CV PDF is printed from /cv/.
# The commit this workflow pushes carries [skip ci] so it cannot start another
# run of itself.
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'assets/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the search index from the pages
        run: python3 tools/build_search.py

      - name: Stamp asset links with their content hash
        run: python3 tools/stamp.py

      - name: Serve the site locally
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 1

      - name: Print /cv/ to PDF
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --virtual-time-budget=10000 \
            --no-pdf-header-footer \
            --print-to-pdf=cv/ga-hing-woo-cv.pdf \
            http://localhost:8000/cv/
          ls -la cv/ga-hing-woo-cv.pdf

      - name: Commit what changed
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Stamp assets, regenerate CV PDF [skip ci]"
            git push
          fi
